services:
  # FastAPI + LangGraph application
  agentic-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agentic-template-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
    volumes:
      - ../src:/app/src:ro # Mount source for development (read-only)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - agentic-network

  # RAG Template API
  rag-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rag
    container_name: agentic-rag-api
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8001
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ../src/rag_template:/app/src/rag_template:ro
      - ../src/server/rag_server:/app/src/server/rag_server:ro
    depends_on:
      milvus-standalone:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - agentic-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Milvus vector database
  milvus-standalone:
    image: milvusdb/milvus:v2.4.0
    container_name: agentic-milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - agentic-network

  # etcd for Milvus
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: agentic-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - agentic-network

  # MinIO for Milvus
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: agentic-minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - minio-data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - agentic-network

  # OpenWebUI for chat interface
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: agentic-openwebui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://agentic-api:8000
      - OPENAI_API_KEY=dummy-key # Required but can be dummy for local APIs
      - WEBUI_AUTH=False # Disable authentication for development
      - WEBUI_NAME=Agentic Template Chat
      - WEBUI_URL=http://localhost:3000
    volumes:
      - openwebui-data:/app/backend/data
    depends_on:
      agentic-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agentic-network

networks:
  agentic-network:
    driver: bridge

volumes:
  openwebui-data:
  milvus-data:
  etcd-data:
  minio-data:
