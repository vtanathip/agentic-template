[project]
name = "agentic-template"
version = "0.1.0"
description = "Starter Kit for Building AI Agents with LangChain"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    # RAG dependencies
    "langchain>=0.3.0",
    "docling>=2.0.0",
    "pymilvus>=2.4.0",
    "sentence-transformers>=2.2.0",
    "ollama>=0.3.0",
    "python-multipart>=0.0.6", # For file uploads
    "langgraph-cli[inmem]>=0.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "httpx>=0.24.0",
    "mypy>=1.0.0", # Type checker to catch method errors before runtime
    "types-requests>=2.31.0", # Type stubs for requests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_template", "src/server", "src/rag_template"]
sources = ["src"]

[tool.hatch.metadata]
allow-direct-references = true
