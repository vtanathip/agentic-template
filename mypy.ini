[mypy]
# Global mypy configuration
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False  # Set to True for stricter checking
ignore_missing_imports = True  # Ignore missing type stubs for third-party libraries

# Specific module configurations
[mypy-tests.*]
# Less strict for tests
ignore_errors = False

[mypy-src.rag_template.*]
# Enable stricter checking for RAG template
disallow_untyped_defs = False
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
